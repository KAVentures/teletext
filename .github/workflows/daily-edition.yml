name: Publish one daily Teletext edition

on:
  # Automatic one-time initialization after this workflow is merged.
  # Subsequent content commits from this workflow do not match this path.
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-edition.yml"
  schedule:
    - cron: "17 6 * * *" # UTC; about 08:17 Sweden summer / 07:17 winter
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: teletext-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c # v4.4.0
        with:
          node-version: "24"
      - run: node --test scripts/daily-utils.test.mjs

      - name: Wait until Vercel production has the protected publisher
        run: |
          for attempt in $(seq 1 30); do
            status="$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' https://x.kinvectum.com/api/internal/daily-edition || true)"
            if [ "$status" = "405" ]; then
              echo "Production publisher is deployed."
              exit 0
            fi
            echo "Waiting for production publisher (HTTP $status)..."
            sleep 10
          done
          echo "Production publisher did not become ready; no API request made."
          exit 1

      - name: Reserve exactly one daily attempt (no paid API call)
        id: claim
        run: node scripts/claim-daily.mjs

      - name: Commit attempt marker before provider request
        if: steps.claim.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-attempt.json
          git commit -m "data: mark daily bulletin attempt"
          git push origin HEAD:main

      - name: Generate through authenticated production publisher
        if: steps.claim.outputs.run == 'true'
        run: node scripts/generate-daily.mjs

      - name: Publish snapshot and trigger production deployment
        if: steps.claim.outputs.run == 'true'
        run: |
          git add data/daily-edition.json
          git commit -m "data: publish daily Teletext bulletin"
          git push origin HEAD:main
