name: Publish one daily Teletext edition

on:
  schedule:
    - cron: "17 6 * * *" # UTC; roughly 08:17 Swedish summer time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: teletext-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c # v4.4.0
        with:
          node-version: "24"
      - name: Test snapshot safeguards
        run: node --test scripts/daily-utils.test.mjs
      - name: Generate bulletin and translations
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_MODEL: grok-4.7
        run: node scripts/generate-daily.mjs
      - name: Commit only when edition changes
        run: |
          if git diff --quiet -- data/daily-edition.json; then
            echo "No new edition to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-edition.json
          git commit -m "data: publish UTC daily Teletext bulletin"
          git push origin HEAD:main
